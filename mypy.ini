# Deliberate scope (audit 2026-10): strict mode stays off and CI runs
# `mypy app/` only (see the lint job in .github/workflows/ci.yml and
# scripts/core_quality_gate.sh). The trust loop is validated by runtime
# invariant tests, not by full static typing, so typing is a backstop for
# app/ where bodies of untyped defs are still checked
# (check_untyped_defs = true). Extending to tests/ or to strict mode is
# deferred until the app/ baseline is fully typed; switching it on now
# would fail the build on annotation volume rather than on real defects.
[mypy]
python_version = 3.11
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true

# Deliberate: tests/ are outside the CI type gate on purpose. Test modules
# use loose fixtures, mocks, and dynamic attributes that would need
# pervasive ignores, which would hide more signal than the gate provides.
[mypy-tests.*]
ignore_errors = true

# numpy arrives transitively (chromadb → onnxruntime) and its bundled stubs use
# `type` statements, which mypy rejects while checking under python_version =
# 3.11 even though CI's lint job runs on 3.12. Nothing in app/ is typed against
# numpy, so skip its stubs rather than loosen the target version.
[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = true

# SQLModel's `table=True` metaclass typing is unreliable under mypy when the
# checker runs without a fully resolved SQLModel install (pre-commit
# `uv run --with mypy`). Ignore this module so the hook stays useful for the
# rest of `app/`.
[mypy-app.db.models]
ignore_errors = true
