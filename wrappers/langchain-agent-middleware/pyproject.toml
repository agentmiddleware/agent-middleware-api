[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-agent-middleware"
version = "0.1.0"
description = "LangChain integration for Agent Middleware API (governed permit -> invoke -> receipt)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Christopher Sellers" }]
requires-python = ">=3.11"
keywords = [
    "langchain",
    "langgraph",
    "agent-authorization",
    "delegated-authorization",
    "permits",
    "idempotency",
    "replay-protection",
    "signed-receipts",
    "audit",
    "agent-governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "b2a-sdk>=0.4,<1",
    "langchain-core>=1.0,<2",
    "langgraph>=1.0.10,<2",
    "httpx>=0.25,<1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Homepage = "https://www.thisisatest.tech/"
Documentation = "https://www.thisisatest.tech/"
Repository = "https://github.com/agentmiddleware/agent-middleware-api"
Issues = "https://github.com/agentmiddleware/agent-middleware-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_b2a"]

[tool.hatch.build.targets.sdist]
include = [
    "src/langchain_b2a",
    "tests",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Relative to this directory, so `pytest wrappers/langchain-agent-middleware/tests`
# works from the repository root as well as from here. The bare `b2a_sdk/`
# directory at the repository root would otherwise resolve as a namespace
# package and shadow the real SDK under `b2a_sdk/src`.
pythonpath = ["src", "../../b2a_sdk/src"]
