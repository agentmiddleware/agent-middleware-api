# Secret-scanning config for CI.
#
# Scope note: CI scans the WORKING TREE for speed. History was verified
# separately with a full-history `gitleaks detect --log-opts=--all` under this
# config, most recently on 2026-09-19. The only real credential ever committed
# is the 2026-08-06 leaked key (see docs/api-key-rotation.md), and it is
# reachable from main's own history — the 2026-08-24 note here previously
# claimed the flattening had removed it from main and that pruning stale
# branches would remove the reachable copies. Both were wrong: commit 9e45009
# is an ancestor of origin/main, and `git log origin/main -S` finds the value
# in three commits. The key was rotated dead at the provider on 2026-08-07,
# which was always the only real remediation, and the incident record
# deliberately publishes the retired value anyway. Do not restate the old
# claim. Every other historical finding is synthetic test material or a
# content hash, allowlisted below.

[extend]
useDefault = true

# The default ruleset is entropy-driven: it reliably catches vendor-formatted
# keys (sk_live_..., ghp_..., AKIA...) but NOT low-entropy hand-written ones.
# The key this repo actually leaked — a dictionary-word string assigned to a
# module-level API_KEY — scores too low to trip any built-in rule, so the stock
# scanner would have let it through again. This rule targets the shape of the
# defect (a credential-named variable bound to a literal) rather than the
# randomness of the value.
[[rules]]
id = "hardcoded-credential-assignment"
description = "Credential-named variable assigned a hardcoded string literal"
# The credential name is non-capturing so that capture group 1 is the assigned
# VALUE. gitleaks treats the first group as the secret, and the allowlist below
# matches against the secret — allowlisting placeholders only works if the
# secret is the value rather than the variable name.
regex = '''(?i)\b(?:api[-_]?key|secret[-_]?key|client[-_]?secret|auth[-_]?token|access[-_]?token|bearer[-_]?token|password|passwd)\s*[:=]\s*["']([^"'\s$<>{}]{8,})["']'''
secretGroup = 1
tags = ["hardcoded", "credential"]

[allowlist]
description = "Synthetic credentials used by tests, demos and CI — not real secrets"

paths = [
  # Test suites construct synthetic keys by design.
  '''^tests/''',
  # The SDK's test suite does too (mock-transport clients with fake keys).
  '''^b2a_sdk/tests/''',
  # So do the framework wrappers' suites — same reason, different tree. Without
  # this a full-history scan reports the wrappers' fake api_key= kwargs.
  '''^wrappers/[^/]+/tests/''',
  # Demo transcripts and copy-paste docs use placeholder keys.
  '''^docs/demo-.*\.md$''',
  # Research manifests map source paths to SHA-256 content hashes. The generic
  # rule reads `"app/core/auth.py": "<hash>"` as a credential named after the
  # file, which is 76 of the findings on a full-history scan and none of the
  # secrets. Hashes of public source are not secrets.
  '''^docs/research/''',
  # The generated proof transcript the public site renders records a digest of
  # the trust keys, not the keys: `"keys_sha256": "<hex>"`. Scoped to this one
  # generated file on purpose — allowlisting the value shape instead
  # (^[0-9a-f]{64}$) would also exempt a hex-encoded Ed25519 signing key, which
  # is the one credential class this repo can least afford to stop scanning for.
  '''^site/proof/transcript\.json$''',
]

regexes = [
  # base64 of bytes 0x00..0x1F — a sequential-byte Ed25519 seed used by the
  # demo/dogfood/red-team scripts so their signed output is reproducible.
  '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''',
  # base64 of the literal string "test-signing-key-material-32byte".
  '''dGVzdC1zaWduaW5nLWtleS1tYXRlcmlhbC0zMmJ5dGU=''',
  # Newer scanners also inspect the decoded value of that same public fixture.
  '''^test-signing-key-material-32byte$''',
  # base64 of "test-signing-key-not-for-prod" — a historical CI test constant
  # (commented "Non-secret test material" at its use site); allowlisted so
  # full-history scans stay noise-free.
  '''dGVzdC1zaWduaW5nLWtleS1ub3QtZm9yLXByb2Q=''',
  # Deliberately invalid key used by the credential-misuse invariant attack.
  '''not_a_real_key''',
  # Truncated static-dev-key placeholder in copy-paste docs ("amw_dev_...").
  '''^amw_dev_\.\.\.$''',
  # Placeholder API keys in demos, docs and CI env blocks.
  '''(?i)\b(demo|dogfood|test|example|dummy|fake|placeholder)[-_](admin[-_])?key([-_][0-9]+)?\b''',
  # Copy-paste placeholders in SDK READMEs and quickstarts, e.g. "your-api-key",
  # "your-middleware-api-key", "agt-your-api-key".
  '''(?i)^(agt-)?(your|my|insert|replace|changeme)[-_]''',
  # Illustrative wallet-scoped key in the b2a_sdk examples.
  '''(?i)^agt-xyz123$''',
  # signing_keys.py assigns a key *identifier* (not key material) from settings.
  '''TRUST_SIGNING_KEY_ID''',
  # `self._private_key: Ed25519PrivateKey | None = None` — a type annotation,
  # which the generic-api-key rule reads as an assigned secret value.
  '''Ed25519PrivateKey''',
]
