<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent Middleware API</title>
  <desc id="desc">Authorize one agent action. Charge it once. Prove what happened.</desc>
  <!-- Source for social-card.png. Every color is a styles.css token (ink,
       rule, text, text-dim, brass); the typefaces are the site's own —
       Instrument Serif for the hero line, IBM Plex Mono for the labels.
       Regenerate the PNG with render_social_card.py so those faces render
       from the vendored fonts rather than a viewer's fallbacks. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#243252" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <radialGradient id="crestGlow" cx="0" cy="0" r="1" gradientTransform="translate(1035 72) rotate(132) scale(460 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8a03e" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#d8a03e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1120"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#crestGlow)"/>

  <rect x="64" y="62" width="40" height="10" fill="#d8a03e"/>
  <text x="122" y="75" fill="#93a0bc" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="19" font-weight="600" letter-spacing="2.1">AGENT MIDDLEWARE API</text>

  <g fill="#dee4f2" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="78" font-weight="400">
    <text x="64" y="198">Authorize one agent action.</text>
    <text x="64" y="288">Charge it once.</text>
    <text x="64" y="378">Prove what happened.</text>
  </g>

  <line x1="64" y1="492" x2="1136" y2="492" stroke="#243252"/>

  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="600">
    <text x="64" y="548" fill="#dee4f2">SCOPED AUTHORITY</text>
    <text x="391" y="548" fill="#dee4f2">IDEMPOTENT METERING</text>
    <text x="782" y="548" fill="#dee4f2">SIGNED RECEIPTS</text>
  </g>
  <g fill="#d8a03e">
    <rect x="329" y="537" width="10" height="10" transform="rotate(45 334 542)"/>
    <rect x="720" y="537" width="10" height="10" transform="rotate(45 725 542)"/>
  </g>
  <text x="64" y="592" fill="#93a0bc" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="16">www.thisisatest.tech</text>
  <text x="1136" y="592" text-anchor="end" fill="#93a0bc" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="16">ONE-TOOL DESIGN PARTNER PILOT</text>
</svg>
