<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Agent Middleware API</title>
  <desc id="desc">Make consequential agent actions transactional.</desc>
  <!-- Source for social-card.png. Every color is a styles.css token (ink,
       rule, text, text-dim, brass); the typefaces are the site's own —
       Press Start 2P for the hero line, IBM Plex Mono for the labels.
       Regenerate the PNG with render_social_card.py so those faces render
       from the vendored fonts rather than a viewer's fallbacks.

       Drawn on the same pixel grid as the site: no radius, no blur, no
       rotated square, and a 32px cell that the whole layout snaps to. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4a3d8f" stroke-opacity="0.30" stroke-width="1"/>
    </pattern>
    <!-- Scanlines, matching the CRT layer in styles.css. -->
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#05040f" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d0b1f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="64" y="62" width="40" height="10" fill="#ffc233"/>
  <text x="122" y="76" fill="#a49ddb" font-family="'Press Start 2P', 'Courier New', monospace" font-size="15" font-weight="400">AGENT MIDDLEWARE API</text>

  <!-- Hero. Hard drop shadow one pixel-step down and right, no blur. -->
  <g font-family="'Press Start 2P', 'Courier New', monospace" font-size="40" font-weight="400">
    <g fill="#05040f">
      <text x="68" y="226">MAKE CONSEQUENTIAL</text>
      <text x="68" y="326">AGENT ACTIONS</text>
      <text x="68" y="426">TRANSACTIONAL.</text>
    </g>
    <g fill="#eceafd">
      <text x="64" y="222">MAKE CONSEQUENTIAL</text>
      <text x="64" y="322">AGENT ACTIONS</text>
      <text x="64" y="422">TRANSACTIONAL.</text>
    </g>
  </g>

  <rect x="64" y="504" width="1072" height="3" fill="#4a3d8f"/>

  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="600" fill="#eceafd">
    <text x="64" y="556">LOGICAL ACTION</text>
    <text x="391" y="556">ONE-SHOT DISPATCH</text>
    <text x="782" y="556">HONEST UNCERTAINTY</text>
  </g>
  <!-- Separators: axis-aligned pixel blocks, not rotated squares. A 45deg
       square is the one shape a pixel grid cannot render cleanly. -->
  <g fill="#ffc233">
    <rect x="329" y="544" width="10" height="10"/>
    <rect x="720" y="544" width="10" height="10"/>
  </g>

  <g font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="16" fill="#a49ddb">
    <text x="64" y="598">www.thisisatest.tech</text>
    <text x="1136" y="598" text-anchor="end">ONE-TOOL DESIGN PARTNER PILOT</text>
  </g>

  <rect width="1200" height="630" fill="url(#scan)"/>
</svg>
