<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing concept | thisisatest.tech</title>
    <meta
      name="description"
      content="Design concept: WebGL particle-wave landing treatment for thisisatest.tech. Not the production funnel."
    />
    <!-- Unlisted design study: reachable by URL, never by crawlers. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    @@FONT_PRELOADS@@
    <link rel="stylesheet" href="/fonts.css?v=@@FONTS_CSS_VERSION@@" />
    <link rel="stylesheet" href="/concept/concept.css?v=concept-2" />
    <!-- Blocking on purpose: saved accessibility preferences must apply before
         first paint. Same contract as every other page. -->
    <script src="/a11y-preload.js?v=gateway-10"></script>
    <script defer src="/wave.js?v=gateway-10"></script>
    <script defer src="/a11y.js?v=gateway-10"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Static glow horizon: visible when WebGL is unavailable, painted over
         by the canvas when it is. -->
    <div class="wave-fallback" aria-hidden="true"></div>
    <canvas id="wave-canvas" class="wave-canvas" aria-hidden="true"></canvas>

    <nav class="concept-nav" aria-label="Primary">
      <a class="concept-brand" href="/">
        <span class="concept-mark" aria-hidden="true"></span>
        <span class="concept-wordmark">THISISATEST<span>.TECH</span></span>
      </a>
      <ul class="concept-links">
        <li><a href="/">About</a></li>
        <li><a href="/compare/">Solutions</a></li>
        <li><a href="/proof/">Infrastructure</a></li>
        <li><a href="mailto:@@PUBLIC_CONTACT_EMAIL@@">Contact</a></li>
      </ul>
      <a
        class="concept-access"
        href="/proof/"
        aria-label="ACCESS SYSTEM — open the receipt verification page"
        ><span aria-hidden="true">[&nbsp;</span>ACCESS SYSTEM<span
          aria-hidden="true"
          >&nbsp;]</span
        ></a
      >
    </nav>

    <main id="main" class="concept-hero">
      <p class="concept-badge">
        <span class="concept-badge-dot" aria-hidden="true"></span>
        <span>BETA RELEASE v1.0</span>
      </p>
      <h1 class="concept-headline">Unlock your future&nbsp;growth</h1>
      <p class="concept-sub">
        Through perpetual investment strategies that outperform the market
      </p>
      <a
        class="concept-cta"
        href="@@PUBLIC_BOOKING_URL@@"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="CONTACT US — book a 30-minute call (opens in a new tab)"
        ><span class="concept-cta-face"
          ><span aria-hidden="true">[</span>CONTACT US<span aria-hidden="true"
            >]</span
          ></span
        ></a
      >
    </main>

    <footer class="concept-foot">
      <span>LANDING CONCEPT&ensp;·&ensp;AGENT MIDDLEWARE API</span>
      <span id="wave-stats" aria-hidden="true"></span>
    </footer>
  </body>
</html>
