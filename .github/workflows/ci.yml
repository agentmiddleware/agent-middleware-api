name: CI — Agent Middleware API

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

# Supersede in-flight PR runs when a branch is updated again.
#
# Push runs must never be grouped with each other. cancel-in-progress: false
# alone is not enough: GitHub keeps at most one pending run per group and
# cancels the older pending one when a newer run arrives, so a third push to
# main would cancel the queued middle one. railway-deploy.yml gates a release
# on that exact SHA's push run and treats a `cancelled` conclusion as a failed
# gate — an intermediate commit would become unreleasable. Giving each push its
# own group (run_id is unique per run) means pushes never queue behind one
# another and are never superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # 3.13 is a non-required, experimental leg. Keep fail-fast off so a 3.13
      # breakage cannot cancel the still-running, branch-protection-required
      # 3.11/3.12 legs and thereby block merges.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./b2a_sdk
          pip install pytest pytest-asyncio anyio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not production_trust"

      # These files already ran unfiltered in "Run tests" above, and none carry
      # a production_trust marker, so re-running them added no coverage. Keep
      # the named checkpoint for a legible failure signal, but stop paying for
      # it on all three matrix legs.
      - name: Run trust primitive invariant tests
        if: matrix.python-version == '3.12'
        run: |
          pytest \
            tests/test_permits.py \
            tests/test_receipts.py \
            tests/test_mcp_trust.py \
            tests/test_refund_reconciliation.py \
            tests/test_audit_chain.py \
            tests/test_key_management.py \
            tests/test_idempotency.py \
            tests/test_route_auth_inventory.py \
            -v --tb=short

      - name: Run trust-core coverage gate
        if: matrix.python-version == '3.12'
        run: scripts/trust_coverage_gate.sh

      - name: Run trust-plane demo smoke test
        run: python scripts/demo_trust_plane.py --assert

      - name: Run trust-plane adversarial (red-team) smoke test
        run: python scripts/red_team_trust_plane.py --assert

      - name: Validate OpenAPI spec generates
        run: |
          python -c "
          from app.main import app
          from fastapi.openapi.utils import get_openapi
          spec = get_openapi(title=app.title, version=app.version, description=app.description, routes=app.routes)
          paths = spec.get('paths', {})
          print(f'OpenAPI: {len(paths)} paths validated')
          assert len(paths) > 20, f'Expected >20 paths, got {len(paths)}'
          "

      - name: Verify docs/openapi.json matches app (single source)
        if: matrix.python-version == '3.12'
        run: python scripts/export_openapi.py --check

      - name: Verify simulation inventory matches runtime (Phase 0)
        if: matrix.python-version == '3.12'
        run: python scripts/generate_sim_inventory.py --check

      - name: Verify Alembic migrations upgrade from empty DB
        if: matrix.python-version == '3.12'
        run: pytest tests/test_migrations.py -v --tb=short

  invariant_attack_proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install controlled-harness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./b2a_sdk

      - name: Configure isolated attack state
        run: |
          mkdir -p "$RUNNER_TEMP/invariant-attack-state"
          {
            echo "API_URL=http://127.0.0.1:8000"
            echo "TP_PORT=8000"
            echo "TP_WORKDIR=$RUNNER_TEMP/invariant-attack-state"
            echo "TP_STATE_DIR=$RUNNER_TEMP/invariant-attack-state"
            echo "TP_PIDFILE=$RUNNER_TEMP/invariant-attack-state/server.pid"
            echo "TP_SERVER_LOG=$RUNNER_TEMP/invariant-attack-state/server.log"
            echo "TP_DB_PATH=$RUNNER_TEMP/invariant-attack-state/api.db"
            echo "TP_BOOT=$GITHUB_WORKSPACE/scripts/invariant_attacks/boot_controlled_uv.sh"
            echo "TP_NOTES_PATH=$GITHUB_WORKSPACE/data/dogfood_partner_notes.jsonl"
            echo "TP_PYTHON=$(command -v python)"
            echo "RATE_LIMIT_PER_MINUTE=1000000"
          } >> "$GITHUB_ENV"

      - name: Boot controlled trust plane
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess

          log = open(os.environ["TP_SERVER_LOG"], "ab")
          proc = subprocess.Popen(
              ["bash", os.environ["TP_BOOT"]],
              stdout=log,
              stderr=subprocess.STDOUT,
              start_new_session=True,
              env=os.environ.copy(),
          )
          pathlib.Path(os.environ["TP_PIDFILE"]).write_text(
              str(proc.pid), encoding="utf-8"
          )
          PY
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(180):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8000/health", timeout=1
                  ) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("controlled trust plane did not become healthy")
          PY

      - name: Run shared crash-storm proof
        working-directory: scripts/invariant_attacks
        run: python attack_combined.py

      - name: Redact and validate proof evidence
        if: always()
        working-directory: scripts/invariant_attacks
        run: python redact_evidence.py evidence_attack_combined.json evidence_attack_combined.redacted.json

      - name: Upload redacted invariant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: invariant-attack-proof
          path: scripts/invariant_attacks/evidence_attack_combined.redacted.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop controlled trust plane
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import signal

          pidfile_value = os.environ.get("TP_PIDFILE")
          if not pidfile_value:
              raise SystemExit(0)
          pidfile = pathlib.Path(pidfile_value)
          if pidfile.exists():
              pid = int(pidfile.read_text(encoding="utf-8").strip())
              try:
                  pgid = os.getpgid(pid)
              except ProcessLookupError:
                  raise SystemExit(0)
              if pid > 1 and pgid == pid:
                  os.killpg(pgid, signal.SIGKILL)
          PY

  python_sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # See note on the `test` job: keep the non-required 3.13 leg from
      # cancelling the required 3.10/3.11/3.12 legs and blocking merges.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build SDK wheel and source distribution
        run: |
          SDK_VERSION=$(python -c "import pathlib, re; text=pathlib.Path('b2a_sdk/pyproject.toml').read_text(); print(re.search(r'^version = \"([^\"]+)\"$', text, re.MULTILINE).group(1))")
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          pip install uv pytest pytest-asyncio ruff mypy
          uv build b2a_sdk --out-dir sdk-dist

      - name: Validate clean wheel installation
        run: |
          python -m venv /tmp/b2a-sdk-smoke
          /tmp/b2a-sdk-smoke/bin/python -m pip install "sdk-dist/b2a_sdk-${SDK_VERSION}-py3-none-any.whl"
          cd /tmp
          /tmp/b2a-sdk-smoke/bin/python -c "import b2a_sdk; assert b2a_sdk.__version__ == '${SDK_VERSION}'"

      - name: Run SDK tests and lint against the wheel
        run: |
          pip install "sdk-dist/b2a_sdk-${SDK_VERSION}-py3-none-any.whl"
          cd /tmp
          python -m pytest "$GITHUB_WORKSPACE/b2a_sdk/tests" -q
          cd "$GITHUB_WORKSPACE"
          ruff check b2a_sdk/src b2a_sdk/tests tests/test_python_sdk_trust_loop.py
          mypy --follow-imports=skip \
            b2a_sdk/src/b2a_sdk/client.py \
            b2a_sdk/src/b2a_sdk/models.py \
            b2a_sdk/src/b2a_sdk/errors.py \
            b2a_sdk/src/b2a_sdk/receipt_verifier.py \
            b2a_sdk/src/b2a_sdk/verify_cli.py

      - name: Upload SDK artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdk-${{ env.SDK_VERSION }}
          path: sdk-dist/*
          if-no-files-found: error

  # Railway runs Postgres; the rest of CI runs SQLite. Dialect differences that
  # SQLite accepts silently (notably tz-aware datetimes bound to the schema's
  # TIMESTAMP WITHOUT TIME ZONE columns, which asyncpg rejects outright) are
  # invisible everywhere else and only surface as production 500s.
  postgres_trust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trust_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run trust loop against Postgres (full suite)
        # Run the full trust test suite against PostgreSQL/asyncpg.
        # The module fixture handles alembic migration before tests run.
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/trust_ci
          STATE_BACKEND: postgres
        run: |
          pytest \
            tests/test_permits.py \
            tests/test_receipts.py \
            tests/test_mcp_trust.py \
            tests/test_audit_chain.py \
            tests/test_key_management.py \
            tests/test_idempotency.py \
            tests/test_postgres_datetime_binding.py \
            -v --tb=short

      - name: Run trust-plane demo against Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/trust_ci
          STATE_BACKEND: postgres
          TRUST_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TRUST_SIGNING_PRIVATE_KEY_B64 }}
          TRUST_MODE_ENABLED: true
          VALID_API_KEYS: ci-test-key
        run: |
          alembic upgrade head
          python scripts/demo_trust_plane.py --assert

  # Production-like trust flags (default conftest stays permissive for unit speed).
  production_trust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run production-trust posture tests
        env:
          TRUST_MODE_ENABLED: "true"
          ALLOW_LEGACY_UNPERMITTED_MCP: "false"
          ENABLE_PROOF_SURFACES: "false"
          ENVIRONMENT: production
          DEBUG: "false"
          WEBAUTHN_ALLOW_MOCK: "false"
          # Non-secret test material so prod-like guardrails can validate.
          TRUST_SIGNING_PRIVATE_KEY_B64: dGVzdC1zaWduaW5nLWtleS1tYXRlcmlhbC0zMmJ5dGU=
          PUBLIC_URL: https://api.thisisatest.tech
          VALID_API_KEYS: test-key
          DATABASE_URL: sqlite+aiosqlite:///./test-production-trust.db
        run: |
          pytest tests/test_production_trust_posture.py -m production_trust -v --tb=short

  postgres_permit_concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_middleware_permit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_middleware_permit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio uv

      - name: Prove governed MCP crash consistency
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/agent_middleware_permit_test
          STATE_BACKEND: postgres
          ENVIRONMENT: test
          MCP_STRESS_DB_ISOLATED: "1"
          MCP_STRESS_EXPECTED_DATABASE_NAME: agent_middleware_permit_test
        run: make prove-crash-recovery

      - name: Prove permit row-lock concurrency
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/agent_middleware_permit_test
          RUN_POSTGRES_CONCURRENCY_TESTS: "1"
        run: pytest tests/test_permit_postgres_concurrency.py -v --tb=short

      - name: Prove single-connection verification progress
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/agent_middleware_permit_test
          STATE_BACKEND: postgres
          ENVIRONMENT: test
          RUN_POSTGRES_CONCURRENCY_TESTS: "1"
          DB_POOL_SIZE: "1"
          DB_MAX_OVERFLOW: "0"
        run: |
          pytest -o asyncio_default_fixture_loop_scope=session -v --tb=short \
            tests/test_permit_verification_sessions.py::test_permit_validation_and_replay_complete_with_one_postgres_connection \
            tests/test_permit_verification_sessions.py::test_refund_completion_and_denials_use_one_postgres_connection \
            tests/test_permit_verification_sessions.py::test_pending_refund_creation_uses_one_postgres_connection \
            tests/test_permit_verification_sessions.py::test_public_receipt_export_uses_application_pool_and_authentic_signatures

  # Blocks credentials from being committed. A live production API key reached
  # main through scripts/stress_test_live.py because nothing scanned for this.
  secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Working tree only, for speed. History was verified separately on
      # 2026-08-24 with a full-history gitleaks scan across every ref (see
      # the scope note in .gitleaks.toml): the only real credential ever
      # committed is the 2026-08-06 key — rotated dead at the provider, gone
      # from main's flattened history, still reachable on stale unmerged
      # branches until they are pruned.
      - name: Scan working tree for committed secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

      # Guards the guard: proves the ruleset still catches the exact class of
      # low-entropy credential that leaked, so an over-broad allowlist edit
      # cannot silently disarm this job.
      # The canary value is assembled at runtime via printf's %s rather than
      # written inline, so this workflow file does not itself contain a
      # credential-shaped literal for the scanner to flag on every run.
      - name: Verify scanner still catches a known-bad credential
        run: |
          printf 'API_KEY = "%s"\n' 'canary-lowentropy-credential-must-be-flagged' > ./_gitleaks_canary.py
          if gitleaks detect --no-git --source . --config .gitleaks.toml --redact >/dev/null 2>&1; then
            rm -f ./_gitleaks_canary.py
            echo "::error::Secret scanner did NOT flag a known-bad hardcoded credential. The allowlist or ruleset is too permissive."
            exit 1
          fi
          rm -f ./_gitleaks_canary.py
          echo "Canary correctly detected."

  # Single named check for branch protection: the operator release gate, run
  # exactly as `make trust-release-gate` runs it locally. Requiring this check
  # is what makes the repo practice gate-first, execute-second — see
  # docs/trust-release-gate-branch-protection.md.
  trust_release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./b2a_sdk
          pip install pytest pytest-asyncio pytest-cov anyio httpx

      - name: Run the trust release gate
        run: scripts/trust_release_gate.sh

  # Constant test loop: proves the local trust-plane loop (self-provision path).
  # Runs on pull_request and push to main. Production smoke (api.thisisatest.tech)
  # runs only on push to main when CI_SMOKE_AGENT_KEY is set.
  constant_test_loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run local trust-plane constant test loop (self-provision)
        # Always run: proves the local loop with self-provisioned credentials.
        # Uses quickstart path with ephemeral SQLite and dev key self-provision.
        # Registers two tools (dogfood + harmless second) to prove out-of-scope denial.
        env:
          ENABLE_DEV_KEY_SELF_PROVISION: "true"
          TRUST_MODE_ENABLED: "true"
          ALLOW_LEGACY_UNPERMITTED_MCP: "false"
          ENABLE_PROOF_SURFACES: "false"
          ENABLE_DOGFOOD_TOOL: "true"
          ENABLE_DOGFOOD_SECOND_TOOL: "true"
          TRUST_SIGNING_PRIVATE_KEY_B64: dGVzdC1zaWduaW5nLWtleS1tYXRlcmlhbC0zMmJ5dGU=
          DATABASE_URL: sqlite+aiosqlite:///./constant-test-loop.db
          STATE_BACKEND: sqlite
          SQLITE_URL: ./constant-test-loop-kv.db
        run: |
          # Boot server in background
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          
          # Wait for health endpoint
          for i in {1..60}; do
            if curl -f http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          
          # Run constant test loop (self-provision, no CI_SMOKE_AGENT_KEY)
          # Pass --other-tool to exercise out-of-scope denial with the second registered tool
          python scripts/constant_test_loop.py --other-tool partner.notes.count
          TEST_EXIT=$?
          
          # Clean up server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          exit $TEST_EXIT

      - name: Run production constant test loop (api.thisisatest.tech)
        # SECURITY: Only run on push to default branch (main), never on pull_request.
        # A PR from the same repo can inject code into constant_test_loop.py that
        # exfiltrates CI_SMOKE_AGENT_KEY. Push to main is trusted (requires review).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_URL: https://api.thisisatest.tech
          CI_SMOKE_AGENT_KEY: ${{ secrets.CI_SMOKE_AGENT_KEY }}
          CI_SMOKE_WALLET_ID: ${{ secrets.CI_SMOKE_WALLET_ID }}
          CI_SMOKE_KEY_ID: ${{ secrets.CI_SMOKE_KEY_ID }}
          CI_SMOKE_TOOL: ${{ vars.CI_SMOKE_TOOL }}
          CI_SMOKE_TOOL_ARGS: ${{ vars.CI_SMOKE_TOOL_ARGS }}
        run: |
          # Genuinely opt-in. A secret cannot be tested in a step-level "if",
          # so the skip has to happen here. Both the credential and the tool
          # must be configured: without the key the loop tries to
          # self-provision against production, where that endpoint is
          # disabled, so the run would fail rather than skip.
          if [ -z "$CI_SMOKE_AGENT_KEY" ] || [ -z "$CI_SMOKE_TOOL" ]; then
            echo "Skipping production smoke: set the CI_SMOKE_AGENT_KEY secret"
            echo "and the CI_SMOKE_TOOL variable to enable it."
            exit 0
          fi

          # --tool and --tool-args are both mandatory off loopback: which tool
          # a monitor invokes on every push, and with what payload, is an
          # operator's decision rather than one discovery makes for them. An
          # empty payload is a valid answer but still has to be given.
          TOOL_ARGS="$CI_SMOKE_TOOL_ARGS"
          if [ -z "$TOOL_ARGS" ]; then
            TOOL_ARGS='{}'
          fi

          python scripts/constant_test_loop.py \
            --tool "$CI_SMOKE_TOOL" \
            --tool-args "$TOOL_ARGS"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy app/

      - name: Check doc references resolve
        run: python scripts/check_doc_references.py
