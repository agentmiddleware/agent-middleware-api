name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io). Deliberately NOT wired to release
# tags (v*): a routine release must never publish a registry entry as a
# side effect. See docs/mcp-registry-submission.md for the publish gate.

on:
  push:
    tags:
      - "mcp-registry-v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preflight — remote endpoint must speak spec MCP
        env:
          PREFLIGHT_API_KEY: ${{ secrets.MCP_PREFLIGHT_API_KEY }}
        run: |
          set -euo pipefail
          URL="$(jq -r '.remotes[0].url' server.json)"
          echo "Probing ${URL} with an MCP initialize request"
          BODY='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"registry-preflight","version":"0.0.0"}}}'
          CURL_ARGS=(-sS --max-time 30 -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream")
          if [ -n "${PREFLIGHT_API_KEY:-}" ]; then
            CURL_ARGS+=(-H "X-API-Key: ${PREFLIGHT_API_KEY}")
          fi
          if ! RESPONSE="$(curl --fail-with-body "${CURL_ARGS[@]}" -d "${BODY}" "${URL}")"; then
            echo "::error::Preflight failed: ${URL} rejected an MCP initialize request."
            echo "::error::Do not publish a transport the server does not serve (docs/mcp-registry-submission.md)."
            exit 1
          fi
          # The response may be plain JSON or a Streamable HTTP SSE frame
          # ("data: {...}"); accept either.
          PROTOCOL="$(printf '%s\n' "${RESPONSE}" | sed -n 's/^data: //p' | head -n 1 | jq -r '.result.protocolVersion // empty' 2>/dev/null || true)"
          if [ -z "${PROTOCOL}" ]; then
            PROTOCOL="$(printf '%s' "${RESPONSE}" | jq -r '.result.protocolVersion // empty' 2>/dev/null || true)"
          fi
          if [ -z "${PROTOCOL}" ]; then
            echo "::error::Preflight failed: initialize returned no result.protocolVersion."
            printf '%s\n' "${RESPONSE}"
            exit 1
          fi
          echo "Preflight OK: server negotiated MCP protocol version ${PROTOCOL}"

      - name: Sync server.json version from tag
        if: startsWith(github.ref, 'refs/tags/mcp-registry-v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/mcp-registry-v}"
          jq --arg v "${VERSION}" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "Publishing version ${VERSION}"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Verify listing
        run: |
          set -euo pipefail
          NAME="$(jq -r '.name' server.json)"
          sleep 5
          curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" | jq .
