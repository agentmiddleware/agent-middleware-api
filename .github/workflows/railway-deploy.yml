# Manual Railway deploy, gated on green CI + preflight.
#
# This does NOT auto-deploy on push, and it does NOT use Railway's
# "Redeploy from GitHub source" — docs/deploy-railway.md rules both out. It
# runs the same canonical `railway up` from a checkout of the ref you pick,
# building the in-repo Dockerfile, after checking that:
#
#   1. the CI workflow concluded successfully for that exact commit, and
#   2. the deployed service is currently in the expected posture.
#
# Inert until an operator adds the RAILWAY_TOKEN secret (a project token for
# the target Railway project). Without it the job stops before touching
# anything.
name: Deploy to Railway

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: main
      service:
        description: "Railway service name"
        required: true
        default: api-service
      skip_ci_gate:
        description: "Deploy even if CI is not green for this commit (emergency only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require RAILWAY_TOKEN
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Add a Railway project token before using this workflow."
            exit 1
          fi

      - name: Require the API service deploy path
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          if [ "$SERVICE" != "api-service" ]; then
            echo "::error::This workflow's migration and posture gates are specific to api-service."
            exit 1
          fi

      - name: Require green CI for ${{ steps.sha.outputs.sha }}
        if: ${{ !inputs.skip_ci_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion != null)][0].conclusion // "none"')
          echo "CI conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI is '$conclusion' for $SHA — refusing to deploy. Re-run CI, or dispatch with skip_ci_gate=true."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install preflight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Before deploy, check live posture only. Post-deploy schema parity uses
      # the Postgres service's explicit public URL because `railway run`
      # executes here on the GitHub runner, outside Railway private DNS.
      - name: Preflight — current service posture
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: python scripts/railway_preflight.py --live --strict

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy (railway up)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ inputs.service }}" --environment production --ci

      # `railway run` executes on this GitHub runner. Wait until Railway reports
      # that the new deployment is the only active deployment before scrubbing
      # compatibility columns that an old worker could still write.
      - name: Wait for old workers to drain
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ inputs.service }}
          EXPECTED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          latest=$(railway deployment list \
            --service "$SERVICE" \
            --environment production \
            --limit 1 \
            --json)
          deployment_id=$(jq -er '.[0].id' <<<"$latest")
          deployment_sha=$(jq -r '.[0].meta.commitHash // ""' <<<"$latest")
          if [ "$deployment_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Latest Railway deployment is not the checked-out commit."
            exit 1
          fi

          for _attempt in $(seq 1 60); do
            snapshot=$(railway status --environment production --json)
            state=$(jq -r \
              --arg service "$SERVICE" \
              --arg deployment "$deployment_id" '
                ([
                  .environments.edges[].node
                  | select(.name == "production")
                  | .serviceInstances.edges[].node
                  | select(.serviceName == $service)
                ][0] // null) as $instance
                | if $instance == null then "missing"
                  elif (($instance.activeDeployments | length) == 1
                    and $instance.activeDeployments[0].id == $deployment
                    and $instance.activeDeployments[0].status == "SUCCESS")
                  then "ready"
                  else "waiting"
                  end
              ' <<<"$snapshot")
            if [ "$state" = "ready" ]; then
              echo "New deployment is the only active worker set."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Old Railway workers did not drain before timeout."
          exit 1

      - name: Retire legacy credentials after drain
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --service Postgres --environment production -- \
            python scripts/retire_owner_keys.py

      # `railway run` is local, so the API service's private DATABASE_URL is
      # unusable here. Load the Postgres service environment and require its
      # explicit public URL; the preflight never prints the URL or falls back.
      - name: Verify deploy — migrations + posture
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          railway run --service Postgres --environment production -- \
            python scripts/railway_preflight.py \
              --public-db \
              --strict \
              --url "$PUBLIC_URL"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Railway deploy"
            echo ""
            echo "- ref: \`${{ inputs.ref }}\` (\`${{ steps.sha.outputs.sha }}\`)"
            echo "- service: \`${{ inputs.service }}\`"
            echo "- CI gate: ${{ inputs.skip_ci_gate && 'SKIPPED (emergency)' || 'enforced' }}"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
