# Validate a Railway release before an operator deploys it from a clean checkout.
#
# This workflow is deliberately non-mutating. A qualified private deployment
# must run its database checks inside the selected Railway API container, where
# DATABASE_URL resolves over Railway private networking. GitHub-hosted runners
# cannot reach that network, and adding a workspace-wide SSH key to CI would
# broaden production access beyond the existing project-scoped credential.
name: Validate Railway Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to validate for a manual deploy"
        required: true
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: railway-release-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not integrated into origin/main."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require green CI for exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.event == "push" and .conclusion != null)][0].conclusion // "none"')
          echo "CI conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI is '$conclusion' for $SHA — refusing release preparation."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install preflight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight — current production posture
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: python scripts/railway_preflight.py --live --strict

      - name: Confirm source checkout is clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"

      - name: Manual private release required
        run: |
          {
            echo "### Railway release validation"
            echo ""
            echo "- exact SHA: \`${{ steps.release.outputs.sha }}\`"
            echo "- version: \`${{ steps.release.outputs.version }}\`"
            echo "- exact-SHA CI: passed"
            echo "- current production posture: passed"
            echo "- deployment performed: **no**"
            echo ""
            echo "Deploy only through the private operator checklist in \`docs/deploy-railway.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
