name: Supply chain

# Fails on any new unpinned GitHub Actions ref. Kept in this file (not ci.yml)
# so the gate itself cannot be weakened by an unrelated CI edit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pinned-actions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Pinned-actions gate
        run: python scripts/check_pinned_actions.py
